name: Deploy to Tencent Cloud

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tencent-production
  cancel-in-progress: true

env:
  TENCENT_USER: ubuntu
  DEPLOY_ROOT: /data/LingerZen

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TENCENT_HOST: ${{ secrets.TENCENT_HOST }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package source
        run: |
          test -n "$TENCENT_HOST"
          tar \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=dist \
            --exclude=.astro \
            --exclude='.env*' \
            --exclude='*.pem' \
            --exclude='*.key' \
            --exclude='*.crt' \
            --exclude='*.p12' \
            --exclude='*.pfx' \
            -czf "$RUNNER_TEMP/lingerzen-source.tar.gz" .

      - name: Configure SSH
        env:
          TENCENT_SSH_KEY: ${{ secrets.TENCENT_SSH_KEY }}
          TENCENT_KNOWN_HOSTS: ${{ secrets.TENCENT_KNOWN_HOSTS }}
        run: |
          test -n "$TENCENT_SSH_KEY"
          test -n "$TENCENT_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$TENCENT_SSH_KEY" > ~/.ssh/tencent.pem
          printf '%s\n' "$TENCENT_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/tencent.pem ~/.ssh/known_hosts

      - name: Upload source
        run: |
          scp \
            -i ~/.ssh/tencent.pem \
            -P 22 \
            "$RUNNER_TEMP/lingerzen-source.tar.gz" \
            "$TENCENT_USER@$TENCENT_HOST:/tmp/lingerzen-${GITHUB_SHA}.tar.gz"

      - name: Build and start on Tencent Cloud
        run: |
          ssh \
            -i ~/.ssh/tencent.pem \
            -p 22 \
            "$TENCENT_USER@$TENCENT_HOST" \
            "sudo -n -i bash -s -- '$DEPLOY_ROOT' '$GITHUB_SHA'" <<'REMOTE'
          set -eu
          DEPLOY_ROOT="$1"
          RELEASE="$2"
          release_dir="$DEPLOY_ROOT/releases/$RELEASE"
          mkdir -p "$release_dir"
          tar -xzf "/tmp/lingerzen-$RELEASE.tar.gz" -C "$release_dir"
          rm -f "/tmp/lingerzen-$RELEASE.tar.gz"
          ln -sfn "$release_dir" "$DEPLOY_ROOT/current"
          test -r "$DEPLOY_ROOT/.env"
          grep -Eq '^GITHUB_CLIENT_ID=[^[:space:]].*$|^GITHUB_OAUTH_CLIENT_ID=[^[:space:]].*$' "$DEPLOY_ROOT/.env"
          grep -Eq '^GITHUB_CLIENT_SECRET=[^[:space:]].*$|^GITHUB_OAUTH_CLIENT_SECRET=[^[:space:]].*$' "$DEPLOY_ROOT/.env"
          cd "$DEPLOY_ROOT/current"
          docker compose -p lingerzen build
          docker compose -p lingerzen up -d --remove-orphans
          docker image prune -f --filter "label=com.docker.compose.project=lingerzen"
          REMOTE

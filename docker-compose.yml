services:
  firefly:
    build:
      context: .
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    image: lingerzen:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - path: /data/LingerZen/.env
        required: false
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4321
    ports:
      - "0.0.0.0:4321:4321"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:4321/')
          .then((response) => process.exit(response.ok ? 0 : 1))
          .catch(() => process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
